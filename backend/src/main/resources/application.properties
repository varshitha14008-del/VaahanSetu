# =====================================================================
# VaahanSetu backend configuration
# =====================================================================
# Active Database: Shared Neon Cloud PostgreSQL Database
# Host: ep-rough-mode-azjj7ke6.c-3.ap-southeast-1.aws.neon.tech
# Database: vaahansetu
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-rough-mode-azjj7ke6.c-3.ap-southeast-1.aws.neon.tech/vaahansetu?sslmode=require&options=-c%20timezone=UTC}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_7lYrOFQjLhg6}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Connection pool settings (optimized for cloud serverless Neon)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=0

# Server port and network interface binding (dynamic Render/cloud PORT support)
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
