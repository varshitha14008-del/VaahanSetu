# Database credentials are supplied by the hosting platform as environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Explicit CORS allowlist for Render and local development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://vaahansetu.onrender.com,http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080,http://127.0.0.1:5500}
