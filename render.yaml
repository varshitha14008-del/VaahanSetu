services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: vaahansetu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/routes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-rough-mode-azjj7ke6.c-3.ap-southeast-1.aws.neon.tech/vaahansetu?sslmode=require&options=-c%20timezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_7lYrOFQjLhg6
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "30000"

  # 2. Static Web Site (Passenger & Admin Portal)
  - type: web
    name: vaahansetu-portal
    runtime: static
    rootDir: frontend
    buildCommand: echo "Deploying static assets"
    staticPublishPath: .
